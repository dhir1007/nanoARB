[package]
name = "dbn-download"
version = "0.1.0"
edition = "2021"
description = "CLI tool to download historical market data from Databento"

[dependencies]
databento = "0.43"
dbn = "0.51"
clap = { version = "4.4", features = ["derive"] }
tokio = { version = "1.35", features = ["full"] }
time = { version = "0.3", features = ["macros", "parsing"] }
anyhow = "1.0"

[[bin]]
name = "dbn-download"
path = "src/main.rs"
