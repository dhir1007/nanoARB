[package]
name = "nano-hl"
version = "0.1.0"
edition = "2021"
description = "Hyperliquid adapter for the nanoARB paper-trading engine"

[[bin]]
name = "nano-hl"
path = "src/main.rs"

[dependencies]
# ── nanoARB internal crates (adjust paths if your workspace layout differs) ──
nano-core    = { path = "../nano-core" }
nano-feed    = { path = "../nano-feed" }
nano-lob     = { path = "../nano-lob" }
nano-strategy = { path = "../nano-strategy" }
nano-backtest = { path = "../nano-backtest" }
prometheus   = "0.13"
hyper        = { version = "0.14", features = ["server", "http1", "tcp"] }

# ── async runtime ──
tokio        = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.21", features = ["native-tls"] }
futures-util = "0.3"

# ── serialization ──
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"

# ── utilities ──
anyhow       = "1"
tracing      = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono       = "0.4"
clap         = { version = "4", features = ["derive"] }